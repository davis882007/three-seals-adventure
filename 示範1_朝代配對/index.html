<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="給國小生玩的臺灣歷史時期事件配對遊戲。">
  <title>臺灣歷史對對碰｜臺灣歷史時期配對</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='7' y='7' width='50' height='50' rx='9' fill='%23a8322d'/%3E%3Cpath d='M18 20h28M18 32h28M18 44h28M24 15v34M40 15v34' stroke='%23fff7df' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #2f3430;
      --ink-soft: #5d6259;
      --paper: #fffaf0;
      --paper-deep: #f0dfbb;
      --blue: #315e6e;
      --blue-dark: #244752;
      --red: #aa312b;
      --red-dark: #7d221e;
      --gold: #c69242;
      --green: #58705c;
      --shadow: 0 10px 28px rgba(65, 46, 28, .15);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "PingFang TC", "Noto Serif TC", "Microsoft JhengHei", serif;
      background:
        linear-gradient(rgba(255, 252, 242, .88), rgba(255, 252, 242, .91)),
        url("assets/images/taiwan-map-bg.png") center / cover fixed;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .map-link { position: fixed; z-index: 50; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 9px 15px; border: 2px solid #244752; border-radius: 999px; color: #fffaf0; background: rgba(49,94,110,.94); box-shadow: 0 5px 12px rgba(43,48,42,.2); text-decoration: none; font-weight: 850; }
    .map-link:hover { transform: translateY(-2px); }
    .dialog-map { display: inline-block; margin-top: 12px; color: var(--blue-dark); font-weight: 850; text-underline-offset: 4px; }

    .game-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 36px;
    }

    .game-header {
      display: grid;
      grid-template-columns: minmax(240px, 480px) minmax(260px, 1fr);
      align-items: center;
      gap: 20px;
      margin-bottom: 14px;
    }

    .title-banner {
      position: relative;
      width: min(100%, 500px);
      display: grid;
      place-items: center;
    }

    .title-plaque {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 8px 10px rgba(66, 42, 23, .18));
    }

    .game-title {
      position: absolute;
      width: 70%;
      margin: 0;
      color: var(--blue-dark);
      font-size: clamp(1.55rem, 2.8vw, 2.35rem);
      font-weight: 950;
      line-height: 1.15;
      letter-spacing: .08em;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255,255,255,.65);
    }

    .header-side {
      display: grid;
      gap: 9px;
    }

    .instruction {
      margin: 0;
      color: #4b504a;
      font-size: 1rem;
      line-height: 1.65;
      font-weight: 650;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      height: 12px;
      flex: 1;
      overflow: hidden;
      border: 2px solid rgba(49, 94, 110, .32);
      border-radius: 999px;
      background: rgba(255, 255, 255, .65);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), #739c8b);
      transition: width .35s ease;
    }

    .score {
      min-width: 84px;
      color: var(--blue-dark);
      font-size: 1rem;
      font-weight: 800;
      text-align: right;
    }

    .game-board {
      display: grid;
      grid-template-columns: minmax(410px, .92fr) minmax(430px, 1.08fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(115, 88, 45, .28);
      border-radius: 22px 10px 22px 10px;
      background: rgba(255, 250, 238, .86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 8px;
      pointer-events: none;
      border: 1px dashed rgba(145, 71, 45, .2);
      border-radius: 16px 7px 16px 7px;
    }

    .panel-inner { position: relative; padding: 18px; }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 13px;
      color: var(--blue-dark);
      font-size: 1.12rem;
      letter-spacing: .08em;
    }

    .panel-title::before,
    .panel-title::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(49, 94, 110, .45));
    }

    .panel-title::after { transform: scaleX(-1); }

    .era-list { display: grid; gap: 10px; }

    .era-target {
      position: relative;
      display: grid;
      grid-template-columns: 76px 86px 1fr;
      align-items: center;
      min-height: 96px;
      overflow: hidden;
      border: 2px solid rgba(71, 92, 75, .32);
      border-radius: 15px 7px 15px 7px;
      background: rgba(255, 255, 249, .72);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .era-target.is-over {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(198, 146, 66, .2);
    }

    .era-target.is-complete { border-color: rgba(170, 49, 43, .5); }

    .era-art {
      width: 76px;
      height: 100%;
      min-height: 92px;
      object-fit: cover;
      border-right: 1px solid rgba(96, 72, 41, .2);
    }

    .era-name {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--blue-dark);
      font-size: 1.14rem;
      font-weight: 900;
      text-align: center;
      line-height: 1.28;
    }

    .era-step {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fffdf5;
      background: var(--blue);
      font-size: .8rem;
      font-weight: 900;
    }

    .drop-slots {
      min-height: 70px;
      padding: 7px 8px 7px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .drop-hint {
      margin: 0;
      color: #8b806f;
      font-size: .88rem;
      text-align: center;
      letter-spacing: .08em;
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .event-card,
    .locked-card {
      position: relative;
      border: 0;
      color: #3d3b34;
      background:
        linear-gradient(90deg, #cfad70 0 7px, transparent 7px calc(100% - 7px), #cfad70 calc(100% - 7px)),
        linear-gradient(180deg, #fff9e7, #f4e4bd);
      box-shadow: 0 5px 12px rgba(75, 54, 29, .13);
    }

    .event-card {
      min-height: 76px;
      padding: 12px 20px;
      border-radius: 8px 3px 8px 3px;
      cursor: grab;
      touch-action: none;
      font-size: 1rem;
      font-weight: 750;
      line-height: 1.45;
      text-align: left;
      user-select: none;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }

    .event-card::before,
    .event-card::after {
      content: "";
      position: absolute;
      top: 7px;
      bottom: 7px;
      width: 5px;
      border-radius: 50%;
      background: #8f6b3b;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    }

    .event-card::before { left: 4px; }
    .event-card::after { right: 4px; }

    .event-card:hover { transform: translateY(-2px) rotate(-.25deg); box-shadow: 0 8px 18px rgba(75, 54, 29, .18); }
    .event-card:active { cursor: grabbing; }
    .event-card.is-selected { outline: 4px solid rgba(49, 94, 110, .3); transform: translateY(-2px); }
    .event-card.is-drag-source { opacity: .36; }

    .event-card:focus-visible,
    .era-target:focus-visible,
    .restart-button:focus-visible {
      outline: 3px solid #16718c;
      outline-offset: 3px;
    }

    .locked-card {
      min-height: 30px;
      padding: 6px 36px 6px 13px;
      border-radius: 5px 2px 5px 2px;
      font-size: .82rem;
      font-weight: 750;
      line-height: 1.35;
    }

    .stamp {
      position: absolute;
      right: 5px;
      top: 50%;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      transform: translateY(-50%) rotate(-12deg) scale(0);
      border: 2px solid var(--red);
      border-radius: 50%;
      color: var(--red);
      font-size: .7rem;
      font-weight: 900;
      line-height: 1;
      animation: stamp-in .36s cubic-bezier(.2, .9, .2, 1.25) forwards;
    }

    .drag-ghost {
      position: fixed;
      z-index: 9999;
      width: min(280px, calc(100vw - 28px));
      min-height: 68px;
      padding: 12px 20px;
      display: grid;
      place-items: center;
      pointer-events: none;
      border: 1px solid rgba(126, 91, 45, .35);
      border-radius: 8px 3px 8px 3px;
      color: #3d3b34;
      background: linear-gradient(180deg, #fff9e7, #f0dbac);
      box-shadow: 0 18px 36px rgba(55, 40, 24, .26);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.4;
      text-align: center;
      transform: translate(-50%, -50%) rotate(-2deg);
    }

    .feedback {
      min-height: 28px;
      margin: 12px 0 0;
      color: var(--blue-dark);
      font-size: .96rem;
      font-weight: 800;
      text-align: center;
    }

    .feedback.is-error { color: var(--red-dark); }
    .feedback.is-good { color: #3f6c50; }

    .shake { animation: shake .42s ease; }

    .success-dialog {
      width: min(430px, calc(100% - 32px));
      padding: 0;
      border: 0;
      border-radius: 24px 10px 24px 10px;
      background: transparent;
      color: var(--ink);
    }

    .success-dialog::backdrop { background: rgba(30, 40, 39, .58); backdrop-filter: blur(3px); }

    .success-card {
      padding: 30px 26px 26px;
      border: 2px solid rgba(145, 87, 42, .4);
      border-radius: inherit;
      background: #fff8e8 url("assets/images/taiwan-map-bg.png") center / cover;
      box-shadow: 0 22px 70px rgba(20, 22, 21, .32);
      text-align: center;
    }

    .success-seal {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 6px double var(--red);
      border-radius: 50%;
      color: var(--red);
      background: rgba(255, 250, 238, .8);
      font-size: 1.65rem;
      font-weight: 950;
      letter-spacing: .08em;
      transform: rotate(-7deg);
    }

    .success-card h2 { margin: 0 0 8px; color: var(--blue-dark); font-size: 1.8rem; }
    .success-card p { margin: 0 0 22px; font-size: 1.05rem; line-height: 1.7; }

    .restart-button {
      min-height: 48px;
      padding: 10px 24px;
      border: 0;
      border-radius: 999px;
      color: #fffdf6;
      background: var(--blue);
      box-shadow: 0 6px 0 var(--blue-dark);
      cursor: pointer;
      font-weight: 850;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .restart-button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--blue-dark); }
    .restart-button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }

    @keyframes stamp-in {
      65% { transform: translateY(-50%) rotate(-12deg) scale(1.18); }
      100% { transform: translateY(-50%) rotate(-12deg) scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-1deg); }
      50% { transform: translateX(7px) rotate(1deg); }
      75% { transform: translateX(-4px); }
    }

    @media (max-width: 880px) {
      body { background-attachment: scroll; }
      .game-shell { width: min(720px, calc(100% - 22px)); padding-top: 10px; }
      .game-header { grid-template-columns: 1fr; justify-items: center; gap: 5px; }
      .title-banner { width: min(420px, 92vw); }
      .header-side { width: 100%; }
      .instruction { text-align: center; }
      .game-board { grid-template-columns: 1fr; }
      .era-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .era-target { grid-template-columns: 66px 74px 1fr; min-height: 90px; }
      .era-art { width: 66px; min-height: 88px; }
      .era-name { padding-inline: 6px; font-size: 1rem; }
      .locked-card { font-size: .78rem; }
    }

    @media (max-width: 560px) {
      .game-shell { width: min(100% - 16px, 480px); }
      .game-header { margin-bottom: 10px; }
      .instruction { font-size: .93rem; line-height: 1.55; }
      .panel-inner { padding: 14px 12px; }
      .panel-title { font-size: 1rem; margin-bottom: 10px; }
      .era-list { gap: 8px; }
      .era-target { grid-template-columns: 58px 1fr; grid-template-rows: 52px auto; min-height: 118px; align-items: stretch; }
      .era-art { grid-row: 1; width: 58px; min-height: 52px; }
      .era-name { display: flex; align-items: center; justify-content: center; padding: 4px; }
      .drop-slots { grid-column: 1 / -1; min-height: 58px; padding: 5px; }
      .drop-hint { font-size: .78rem; }
      .locked-card { padding-right: 33px; }
      .event-grid { gap: 8px; }
      .event-card { min-height: 86px; padding: 10px 16px; font-size: .92rem; line-height: 1.38; }
      .status-row { padding-inline: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="map-link" href="../大冒險地圖/index.html" aria-label="回到三印大冒險地圖">← 回到大地圖</a>
  <main class="game-shell">
    <header class="game-header">
      <div class="title-banner">
        <img class="title-plaque" src="assets/images/taiwan-title-plaque.png" alt="" aria-hidden="true">
        <h1 class="game-title">臺灣歷史對對碰</h1>
      </div>
      <div class="header-side">
        <p class="instruction">把事件小卷軸拖到正確時期。手機也可以先點事件，再點時期。</p>
        <div class="status-row" aria-label="答題進度">
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
          <div class="score" id="score">0／16</div>
        </div>
      </div>
    </header>

    <section class="game-board" aria-label="臺灣歷史對對碰遊戲區">
      <section class="panel" aria-labelledby="eraHeading">
        <div class="panel-inner">
          <h2 class="panel-title" id="eraHeading">臺灣歷史時期</h2>
          <div class="era-list" id="eraList"></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="eventHeading">
        <div class="panel-inner">
          <h2 class="panel-title" id="eventHeading">事件小卷軸</h2>
          <div class="event-grid" id="eventGrid"></div>
          <p class="feedback" id="feedback" aria-live="polite">準備好了嗎？挑一張卷軸開始吧！</p>
        </div>
      </section>
    </section>
  </main>

  <dialog class="success-dialog" id="successDialog" aria-labelledby="successTitle">
    <div class="success-card">
      <div class="success-seal" aria-hidden="true">過關</div>
      <h2 id="successTitle">太厲害了，全部配對成功！</h2>
      <p>你把 16 個事件都送回正確的臺灣歷史時期了。</p>
      <button class="restart-button" id="restartButton" type="button">重新開始</button>
      <br><a class="dialog-map" href="../大冒險地圖/index.html">← 回到大地圖領取社會之印</a>
    </div>
  </dialog>

  <script>
    const ADVENTURE_KEY = "starmathAdventureV1";
    function awardAdventureSeal(seal) {
      let data = {};
      try { data = JSON.parse(localStorage.getItem(ADVENTURE_KEY)) || {}; } catch (_) { data = {}; }
      data.startedAt = Number(data.startedAt) || Date.now();
      data.seals = { history: false, idiom: false, hero: false, ...(data.seals || {}) };
      data.gate = { history: false, idiom: false, hero: false, ...(data.gate || {}) };
      data.seals[seal] = true;
      localStorage.setItem(ADVENTURE_KEY, JSON.stringify(data));
    }

    const eras = [
      { id: "prehistoric", name: "史前時代", image: "assets/images/prehistoric.png" },
      { id: "indigenous", name: "原住民族社會", image: "assets/images/indigenous.png" },
      { id: "dutch-spanish", name: "荷西時期", image: "assets/images/dutch-spanish.png" },
      { id: "ming-zheng", name: "明鄭時期", image: "assets/images/ming-zheng.png" },
      { id: "qing-taiwan", name: "清帝國時期", image: "assets/images/qing-taiwan.png" },
      { id: "japanese-taiwan", name: "日治時期", image: "assets/images/japanese-taiwan.png" },
      { id: "postwar-taiwan", name: "戰後臺灣", image: "assets/images/postwar-taiwan.png" },
      { id: "contemporary-taiwan", name: "當代臺灣", image: "assets/images/contemporary-taiwan.png" }
    ];

    const events = [
      { id: "prehistoric-1", era: "prehistoric", text: "長濱文化留下石器等遺物" },
      { id: "prehistoric-2", era: "prehistoric", text: "圓山文化與卑南文化留下豐富遺址" },
      { id: "indigenous-1", era: "indigenous", text: "平埔族群在平原與海邊生活" },
      { id: "indigenous-2", era: "indigenous", text: "各原住民族發展多樣的生活與文化" },
      { id: "dutch-spanish-1", era: "dutch-spanish", text: "荷蘭人在臺灣南部建立據點" },
      { id: "dutch-spanish-2", era: "dutch-spanish", text: "西班牙人在臺灣北部建立據點" },
      { id: "ming-zheng-1", era: "ming-zheng", text: "鄭成功驅逐荷蘭人" },
      { id: "ming-zheng-2", era: "ming-zheng", text: "鄭氏政權經營臺灣" },
      { id: "qing-taiwan-1", era: "qing-taiwan", text: "漢人移墾，清廷逐步設置行政區" },
      { id: "qing-taiwan-2", era: "qing-taiwan", text: "開港通商，後來臺灣建省" },
      { id: "japanese-taiwan-1", era: "japanese-taiwan", text: "殖民統治下出現多次抗日活動" },
      { id: "japanese-taiwan-2", era: "japanese-taiwan", text: "交通與產業建設快速發展" },
      { id: "postwar-taiwan-1", era: "postwar-taiwan", text: "戰後社會重建，經濟逐步發展" },
      { id: "postwar-taiwan-2", era: "postwar-taiwan", text: "臺灣從戒嚴走向民主化" },
      { id: "contemporary-taiwan-1", era: "contemporary-taiwan", text: "民主政治與多元文化持續發展" },
      { id: "contemporary-taiwan-2", era: "contemporary-taiwan", text: "臺灣與世界一起關心全球議題" }
    ];

    const eraList = document.querySelector("#eraList");
    const eventGrid = document.querySelector("#eventGrid");
    const feedback = document.querySelector("#feedback");
    const score = document.querySelector("#score");
    const progressFill = document.querySelector("#progressFill");
    const successDialog = document.querySelector("#successDialog");
    const restartButton = document.querySelector("#restartButton");

    let matched = new Set();
    let selectedId = null;
    let dragState = null;
    let suppressClickUntil = 0;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderEras() {
      eraList.innerHTML = eras.map((era, index) => `
        <div class="era-target" data-era="${era.id}" tabindex="0" role="button" aria-label="${era.name}配對區">
          <img class="era-art" src="${era.image}" alt="${era.name}時期插圖" draggable="false">
          <div class="era-name"><span class="era-step" aria-hidden="true">${index + 1}</span><span>${era.name}</span></div>
          <div class="drop-slots" data-slot="${era.id}"><p class="drop-hint">拖到這裡</p></div>
        </div>
      `).join("");
    }

    function renderEvents() {
      eventGrid.innerHTML = shuffle(events).map(event => `
        <button class="event-card" type="button" data-id="${event.id}" aria-label="事件：${event.text}">${event.text}</button>
      `).join("");
    }

    function setFeedback(message, kind = "") {
      feedback.textContent = message;
      feedback.className = `feedback${kind ? ` is-${kind}` : ""}`;
    }

    function updateProgress() {
      const count = matched.size;
      score.textContent = `${count}／${events.length}`;
      progressFill.style.width = `${(count / events.length) * 100}%`;
    }

    function clearSelection() {
      selectedId = null;
      document.querySelectorAll(".event-card.is-selected").forEach(card => card.classList.remove("is-selected"));
    }

    function chooseCard(card) {
      if (!card || matched.has(card.dataset.id)) return;
      const alreadySelected = selectedId === card.dataset.id;
      clearSelection();
      if (!alreadySelected) {
        selectedId = card.dataset.id;
        card.classList.add("is-selected");
        setFeedback("已選好事件，再點一個臺灣歷史時期。", "");
      } else {
        setFeedback("已取消選取。", "");
      }
    }

    function animateWrong(card, target) {
      [card, target].filter(Boolean).forEach(element => {
        element.classList.remove("shake");
        void element.offsetWidth;
        element.classList.add("shake");
        setTimeout(() => element.classList.remove("shake"), 460);
      });
    }

    function attemptMatch(eventId, eraId) {
      const event = events.find(item => item.id === eventId);
      const card = eventGrid.querySelector(`[data-id="${eventId}"]`);
      const target = eraList.querySelector(`[data-era="${eraId}"]`);
      if (!event || !card || !target || matched.has(eventId)) return;

      if (event.era !== eraId) {
        animateWrong(card, target);
        clearSelection();
        setFeedback("再想一想，這個事件不屬於這個時期，卷軸退回囉！", "error");
        return;
      }

      matched.add(eventId);
      const slot = target.querySelector(".drop-slots");
      slot.querySelector(".drop-hint")?.remove();
      const locked = document.createElement("div");
      locked.className = "locked-card";
      locked.innerHTML = `<span>${event.text}</span><span class="stamp" aria-label="答對">正確</span>`;
      slot.appendChild(locked);
      card.remove();
      clearSelection();

      const eraCount = events.filter(item => item.era === eraId).length;
      const matchedEraCount = [...matched].filter(id => events.find(item => item.id === id)?.era === eraId).length;
      if (eraCount === matchedEraCount) target.classList.add("is-complete");

      updateProgress();
      if (matched.size === events.length) {
        awardAdventureSeal("history");
        setFeedback("全部配對成功！", "good");
        setTimeout(() => {
          if (typeof successDialog.showModal === "function") successDialog.showModal();
          else successDialog.setAttribute("open", "");
        }, 520);
      } else {
        setFeedback("答對了！紅章蓋好，繼續挑戰。", "good");
      }
    }

    function positionGhost(x, y) {
      if (!dragState?.ghost) return;
      dragState.ghost.style.left = `${x}px`;
      dragState.ghost.style.top = `${y}px`;
    }

    function highlightTargetAt(x, y) {
      document.querySelectorAll(".era-target.is-over").forEach(target => target.classList.remove("is-over"));
      const target = document.elementFromPoint(x, y)?.closest(".era-target");
      if (target) target.classList.add("is-over");
      return target;
    }

    function autoScrollWhileDragging() {
      if (!dragState?.dragging) return;
      const edge = Math.min(96, window.innerHeight * .16);
      let amount = 0;
      if (dragState.lastY < edge) amount = -14;
      if (dragState.lastY > window.innerHeight - edge) amount = 14;
      if (amount) {
        window.scrollBy(0, amount);
        highlightTargetAt(dragState.lastX, dragState.lastY);
      }
      dragState.raf = requestAnimationFrame(autoScrollWhileDragging);
    }

    eventGrid.addEventListener("pointerdown", event => {
      const card = event.target.closest(".event-card");
      if (!card || event.button > 0) return;
      dragState = {
        pointerId: event.pointerId,
        card,
        startX: event.clientX,
        startY: event.clientY,
        lastX: event.clientX,
        lastY: event.clientY,
        dragging: false,
        ghost: null,
        raf: null
      };
      try { card.setPointerCapture?.(event.pointerId); } catch (_) { /* 測試工具或舊瀏覽器可能沒有活動中的指標 */ }
    });

    eventGrid.addEventListener("pointermove", event => {
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      dragState.lastX = event.clientX;
      dragState.lastY = event.clientY;
      const distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
      if (!dragState.dragging && distance > 8) {
        dragState.dragging = true;
        dragState.card.classList.add("is-drag-source");
        dragState.ghost = document.createElement("div");
        dragState.ghost.className = "drag-ghost";
        dragState.ghost.textContent = dragState.card.textContent;
        document.body.appendChild(dragState.ghost);
        dragState.raf = requestAnimationFrame(autoScrollWhileDragging);
      }
      if (dragState.dragging) {
        event.preventDefault();
        positionGhost(event.clientX, event.clientY);
        highlightTargetAt(event.clientX, event.clientY);
      }
    });

    function finishDrag(event) {
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      const { card, dragging, ghost } = dragState;
      if (dragging) {
        const target = highlightTargetAt(event.clientX, event.clientY);
        suppressClickUntil = Date.now() + 250;
        if (target) attemptMatch(card.dataset.id, target.dataset.era);
        else setFeedback("卷軸回到原位，再拖到一個臺灣歷史時期吧！", "");
      }
      card.classList.remove("is-drag-source");
      ghost?.remove();
      if (dragState.raf) cancelAnimationFrame(dragState.raf);
      document.querySelectorAll(".era-target.is-over").forEach(target => target.classList.remove("is-over"));
      dragState = null;
    }

    eventGrid.addEventListener("pointerup", finishDrag);
    eventGrid.addEventListener("pointercancel", finishDrag);

    eventGrid.addEventListener("click", event => {
      if (Date.now() < suppressClickUntil) return;
      chooseCard(event.target.closest(".event-card"));
    });

    eraList.addEventListener("click", event => {
      const target = event.target.closest(".era-target");
      if (!target || !selectedId) return;
      attemptMatch(selectedId, target.dataset.era);
    });

    eraList.addEventListener("keydown", event => {
      if ((event.key === "Enter" || event.key === " ") && selectedId) {
        event.preventDefault();
        const target = event.target.closest(".era-target");
        if (target) attemptMatch(selectedId, target.dataset.era);
      }
    });

    restartButton.addEventListener("click", () => {
      successDialog.close?.();
      matched = new Set();
      clearSelection();
      renderEras();
      renderEvents();
      updateProgress();
      setFeedback("新的一局開始，事件順序已重新打亂！", "");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderEras();
    renderEvents();
    updateProgress();
  </script>
</body>
</html>
