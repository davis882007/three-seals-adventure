<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e7">
  <meta name="description" content="串連臺灣歷史、成語填字與勇者試煉的三印學習大冒險。">
  <title>三印大冒險｜學習冒險地圖</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23bc493c' stroke='%238a2f28' stroke-width='5'/%3E%3Cpath d='M20 23h24M20 32h24M20 41h24' stroke='%23fff3db' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#273531;--paper:#fffaf0;--red:#ad3c32;--gold:#c6913b;--green:#3e765b;--shadow:0 18px 55px rgba(38,48,42,.22)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100svh;display:grid;place-items:center;color:var(--ink);font-family:"PingFang TC","Noto Serif TC","Microsoft JhengHei",serif;background:radial-gradient(circle at 50% 10%,#fffdf8,#e9e4d8);-webkit-tap-highlight-color:transparent}button,a{font:inherit}
    .page{width:100%;padding:clamp(8px,1.5vw,22px)}.map-stage{position:relative;width:min(1600px,100%);aspect-ratio:16/9;margin:auto;overflow:hidden;border:2px solid rgba(83,76,61,.22);border-radius:clamp(12px,2vw,28px);background:#fff;box-shadow:var(--shadow)}.map-art{display:block;width:100%;height:100%;object-fit:contain}
    .hud{position:absolute;z-index:5;top:clamp(8px,1.5vw,24px);right:clamp(8px,1.5vw,24px);display:flex;align-items:center;gap:9px;padding:8px 10px 8px 15px;border:2px solid rgba(105,68,40,.5);border-radius:999px;background:rgba(255,250,240,.91);box-shadow:0 7px 20px rgba(59,50,38,.16);backdrop-filter:blur(5px)}.count{white-space:nowrap;color:#5c3928;font-weight:900}.count strong{color:var(--red);font-size:clamp(1.05rem,2.1vw,1.65rem)}.clear{border:1px solid #9a7657;border-radius:999px;padding:7px 11px;color:#594636;background:#fffaf0;font-weight:850;cursor:pointer}.clear:hover{background:#f2dfbd}
    .hotspot{position:absolute;z-index:3;border:3px solid transparent;border-radius:28px;background:transparent;cursor:pointer;transition:.2s transform,.2s border-color,.2s box-shadow,.2s background;touch-action:manipulation}.hotspot::after{content:"";position:absolute;inset:8%;border-radius:22px;opacity:0;box-shadow:0 0 34px 16px rgba(255,217,105,.7);transition:.2s opacity;pointer-events:none}.hotspot:hover,.hotspot:focus-visible{outline:0;border-color:rgba(190,116,41,.76);background:rgba(255,235,159,.09);transform:scale(1.018)}.hotspot:hover::after,.hotspot:focus-visible::after{opacity:1}.history{left:4%;top:4%;width:36%;height:38%}.idiom{left:3%;top:49%;width:39%;height:46%}.hero{left:61%;top:48%;width:37%;height:47%}.gate-hotspot{left:39%;top:24%;width:25%;height:37%;border-radius:36%}
    .done-mark{position:absolute;z-index:4;display:none;align-items:center;gap:5px;padding:6px 10px;border:2px solid #fff7df;border-radius:999px;color:#fff;background:var(--green);box-shadow:0 4px 12px rgba(25,55,43,.26);font-size:clamp(.68rem,1.25vw,.95rem);font-weight:900;pointer-events:none}.hotspot.done .done-mark{display:flex}.history .done-mark{right:3%;top:7%}.idiom .done-mark{right:3%;top:8%}.hero .done-mark{left:2%;top:8%}.done-mark::before{content:"✓";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:var(--green);background:#fff}
    .map-help{position:absolute;z-index:4;left:50%;bottom:1.1%;transform:translateX(-50%);margin:0;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.74);color:#6b5d4f;font-size:clamp(.68rem,1.2vw,.94rem);font-weight:750;white-space:nowrap;pointer-events:none}
    dialog{border:0;padding:0;background:transparent}.gate-dialog::backdrop,.complete::backdrop{background:rgba(20,31,27,.64);backdrop-filter:blur(6px)}.gate-panel{width:min(760px,calc(100vw - 24px));max-height:calc(100svh - 24px);overflow:auto;padding:clamp(18px,3.5vw,34px);border:4px double #775238;border-radius:28px;background:linear-gradient(rgba(255,251,239,.96),rgba(245,233,205,.97)),repeating-linear-gradient(3deg,transparent 0 8px,rgba(106,74,42,.03) 9px 10px);box-shadow:var(--shadow);text-align:center}.gate-head{position:relative}.gate-head h2{margin:0;color:#304f46;font-size:clamp(1.6rem,4vw,2.5rem)}.gate-head p{margin:.45rem auto 1.2rem;line-height:1.55}.close{position:absolute;right:-10px;top:-13px;width:42px;height:42px;border:2px solid #806147;border-radius:50%;background:#fffaf0;color:#604a38;font-size:1.45rem;line-height:1;cursor:pointer}
    .slots,.seal-tray{display:grid;grid-template-columns:repeat(3,minmax(0,155px));justify-content:center;gap:clamp(8px,3vw,25px)}.slot{min-height:116px;display:grid;place-items:center;padding:8px;border:3px dashed #a98853;border-radius:50% 47% 52% 48%;color:#795f3e;background:rgba(255,250,226,.58);transition:.18s}.slot.over{transform:scale(1.06);background:#fff0bb}.slot.locked{border-style:solid;border-color:#53a06d;background:#dff1df;box-shadow:0 0 22px rgba(78,151,95,.24)}.slot.wrong{animation:shake .38s}.slot-label{font-weight:900}.slot .mini-seal{width:80px;height:80px}.tray-label{margin:20px 0 8px;font-weight:900}.seal{min-height:108px;display:grid;place-items:center;border:0;background:transparent;cursor:grab;touch-action:none}.seal:active{cursor:grabbing}.seal-mark,.mini-seal{display:grid;place-items:center;aspect-ratio:1;border:5px double #842d28;border-radius:46% 54% 48% 52%;color:#fff7df;background:#b7473b;font-weight:950;letter-spacing:.04em;box-shadow:3px 5px 0 rgba(58,38,28,.18);transform:rotate(-3deg)}.seal-mark{width:92px}.seal:nth-child(2) .seal-mark{transform:rotate(2deg)}.seal:nth-child(3) .seal-mark{transform:rotate(-1deg)}.seal.unowned{opacity:.27;filter:grayscale(1);cursor:not-allowed}.seal.placed{opacity:.22;pointer-events:none}.drag-ghost{position:fixed;z-index:9999;width:92px;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 12px 8px rgba(0,0,0,.3))}.gate-message{min-height:30px;margin:16px 0 0;color:#765b39;font-weight:900}.gate-message.good{color:#377553}.gate-message.bad{color:#b13f35}
    .complete-card{width:min(560px,calc(100vw - 24px));padding:30px;border:5px double #7d542e;border-radius:28px;background:#fff7e5;text-align:center;box-shadow:var(--shadow)}.complete-card h2{margin:.5rem 0;color:#2d5d4d;font-size:clamp(1.65rem,5vw,2.3rem)}.complete-seal{width:110px;margin:auto;aspect-ratio:1;display:grid;place-items:center;border:7px double #9f322d;border-radius:48%;background:#bc493c;color:#fff5dd;font-size:1.5rem;font-weight:950;transform:rotate(-3deg)}.time{font-size:1.35rem;font-weight:900;color:#8d3f31}.again{border:3px solid #70451f;border-radius:15px;padding:12px 27px;background:linear-gradient(#f3c45c,#dc942e);box-shadow:0 5px 0 #70451f;font-weight:950;cursor:pointer}
    .complete{max-width:min(98vw,1400px);max-height:98svh}.ending-card{width:min(96vw,1280px);padding:clamp(8px,1.4vw,18px);border:4px double #7d542e;border-radius:20px;background:#fff7e5;box-shadow:var(--shadow);text-align:center}.ending-art{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:10px;background:#fffaf0}.ending-controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 4px 2px;color:#5c3928;font-weight:850}.ending-controls button{border:2px solid #80552f;border-radius:999px;padding:8px 17px;background:#fffaf0;color:#4a3528;font-weight:850;cursor:pointer}.ending-controls button:disabled{opacity:.4;cursor:default}.ending-controls .again{border-radius:999px;padding:8px 17px;background:#f3c45c;box-shadow:none}.ending-controls .time{font-size:1rem;margin:0 4px}.ending-counter{min-width:3.5em}.ending-controls [hidden]{display:none}
    @keyframes shake{25%,75%{transform:translateX(-8px) rotate(-2deg)}50%{transform:translateX(8px) rotate(2deg)}}
    @media(max-width:620px){.page{padding:0}.map-stage{border:0;border-radius:0}.hud{top:5px;right:5px;gap:5px;padding:4px 5px 4px 9px}.count span{display:none}.clear{padding:5px 8px;font-size:.72rem}.map-help{bottom:.5%;padding:3px 8px}.hotspot{border-radius:14px}.hotspot:hover,.hotspot:focus-visible{transform:none}.done-mark{padding:3px 5px;font-size:.55rem}.done-mark::before{width:13px;height:13px}.done-mark span{display:none}.gate-panel{padding:18px 10px}.close{right:-2px;top:-8px}.slots,.seal-tray{grid-template-columns:repeat(3,1fr);gap:5px}.slot{min-height:90px;font-size:.78rem}.seal{min-height:88px}.seal-mark{width:min(24vw,80px);font-size:.76rem}.slot .mini-seal{width:64px;font-size:.72rem}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="page"><section class="map-stage" aria-label="三印大冒險地圖">
    <img class="map-art" src="map-bg.png" alt="手繪三印大冒險地圖，包含時空卷軸、翰林字陣、勇者試煉與中央三印大門">
    <div class="hud" aria-label="冒險進度"><div class="count"><strong id="sealCount">0／3</strong><span> 持有印章</span></div><button class="clear" id="clearProgress" type="button">清除進度</button></div>
    <a class="hotspot history" data-game="history" href="../示範1_朝代配對/index.html" aria-label="前往時空卷軸：朝代配對"><span class="done-mark"><span>已完成</span></span></a>
    <a class="hotspot idiom" data-game="idiom" href="../示範2_成語填字/index.html" aria-label="前往翰林字陣：成語填字"><span class="done-mark"><span>已完成</span></span></a>
    <a class="hotspot hero" data-game="hero" href="../示範3_打怪RPG/index.html" aria-label="前往勇者試煉：打怪 RPG"><span class="done-mark"><span>已完成</span></span></a>
    <button class="hotspot gate-hotspot" id="openGate" type="button" aria-label="開啟三印大門與印章背包"></button>
    <p class="map-help">點選地標開始闖關・中央大門隨時可開</p>
  </section></main>
  <dialog class="gate-dialog" id="gateDialog" aria-labelledby="gateTitle"><section class="gate-panel">
    <header class="gate-head"><button class="close" id="closeGate" type="button" aria-label="關閉通關大門">×</button><h2 id="gateTitle">三印背包・通關大門</h2><p>把持有的印章拖到正確凹槽。手機也可先點印章，再點凹槽。</p></header>
    <div class="slots" id="slots"><div class="slot" data-slot="history" tabindex="0" role="button"><span class="slot-label">朝代凹槽</span></div><div class="slot" data-slot="idiom" tabindex="0" role="button"><span class="slot-label">成語凹槽</span></div><div class="slot" data-slot="hero" tabindex="0" role="button"><span class="slot-label">勇者凹槽</span></div></div>
    <p class="tray-label">持有的印章</p>
    <div class="seal-tray" id="sealTray"><button class="seal" data-seal="history" type="button"><span class="seal-mark">社會之印</span></button><button class="seal" data-seal="idiom" type="button"><span class="seal-mark">成語之印</span></button><button class="seal" data-seal="hero" type="button"><span class="seal-mark">勇者之印</span></button></div>
    <p class="gate-message" id="gateMessage" aria-live="polite">先完成地圖上的三座學習關卡吧！</p>
  </section></dialog>
  <dialog class="complete" id="completeDialog" aria-label="三印大冒險五幕結局"><div class="ending-card"><img class="ending-art" id="endingArt" src="ending-01.png" alt="第一幕：三印歸位，魔法師站在開啟的大門前"><div class="ending-controls"><button id="endingPrevious" type="button" aria-label="上一幕">上一幕</button><span class="ending-counter" id="endingCounter" aria-live="polite">1／5</span><button id="endingNext" type="button">下一幕</button><p class="time">總時間：<span id="totalTime">00:00</span></p><button id="backToMap" type="button">回到地圖</button><button class="again" id="playAgain" type="button" hidden>再次冒險</button></div></div></dialog>
  <script>
    const STORAGE_KEY="starmathAdventureV1",NAMES={history:"社會之印",idiom:"成語之印",hero:"勇者之印"};
    const safeRead=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return {}}};
    const normalize=data=>({startedAt:Number(data.startedAt)||Date.now(),seals:{history:!!data.seals?.history,idiom:!!data.seals?.idiom,hero:!!data.seals?.hero},gate:{history:data.gate?.history==="history",idiom:data.gate?.idiom==="idiom",hero:data.gate?.hero==="hero"},completedAt:Number(data.completedAt)||null});
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let progress=normalize(safeRead()),selected=null,drag=null,suppressClickUntil=0;const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));save();
    function formatTime(ms){const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return `${h?String(h).padStart(2,"0")+":" : ""}${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
    function render(){const count=Object.values(progress.seals).filter(Boolean).length;$("#sealCount").textContent=`${count}／3`;$$(".hotspot[data-game]").forEach(el=>el.classList.toggle("done",progress.seals[el.dataset.game]));$$(".seal").forEach(el=>{const key=el.dataset.seal;el.classList.toggle("unowned",!progress.seals[key]);el.classList.toggle("placed",!!progress.gate[key]);el.disabled=!progress.seals[key];el.setAttribute("aria-label",progress.seals[key]?NAMES[key]:`${NAMES[key]}尚未取得`)});$$(".slot").forEach(el=>{const key=el.dataset.slot,locked=!!progress.gate[key];el.classList.toggle("locked",locked);el.innerHTML=locked?`<span class="mini-seal">${NAMES[key]}</span>`:`<span class="slot-label">${key==="history"?"朝代":key==="idiom"?"成語":"勇者"}凹槽</span>`});if(Object.values(progress.gate).every(Boolean))complete()}
    function message(text,kind=""){const el=$("#gateMessage");el.textContent=text;el.className=`gate-message ${kind}`}
    function openGate(){if(progress.completedAt&&Object.values(progress.gate).every(Boolean)){showEnding();return}const count=Object.values(progress.seals).filter(Boolean).length;message(count?`背包裡有 ${count} 枚印章，放進正確凹槽吧！`:"先完成地圖上的三座學習關卡吧！");const d=$("#gateDialog");if(!d.open){if(d.showModal)d.showModal();else d.setAttribute("open","")}}
    function place(sealKey,slotKey){if(!sealKey||!progress.seals[sealKey]||progress.gate[sealKey])return;if(sealKey!==slotKey){const slot=document.querySelector(`[data-slot="${slotKey}"]`);slot.classList.remove("wrong");void slot.offsetWidth;slot.classList.add("wrong");setTimeout(()=>slot.classList.remove("wrong"),430);message(`${NAMES[sealKey]}和這個凹槽不合，印章退回原位囉！`,"bad");selected=null;return}progress.gate[slotKey]=sealKey;save();selected=null;message(`${NAMES[sealKey]}已鎖定，凹槽亮起綠光！`,"good");render()}
    const ENDING_ALTS=["第一幕：三印歸位，魔法師站在開啟的大門前","第二幕：魔法師走上雲間紙卷路，回望三關留下的痕跡","第三幕：魔法師在空白盡頭停下腳步","第四幕：魔法師用法杖畫出新的光路","第五幕：魔法師揮手，沿新路走向晨光"];let endingIndex=0;
    function renderEnding(){const n=endingIndex+1;$("#endingArt").src=`ending-${String(n).padStart(2,"0")}.png`;$("#endingArt").alt=ENDING_ALTS[endingIndex];$("#endingCounter").textContent=`${n}／5`;$("#endingPrevious").disabled=endingIndex===0;$("#endingNext").hidden=endingIndex===4;$("#playAgain").hidden=endingIndex!==4}
    function showEnding(){endingIndex=0;renderEnding();$("#totalTime").textContent=formatTime(progress.completedAt-progress.startedAt);const d=$("#completeDialog");if(!d.open){if(d.showModal)d.showModal();else d.setAttribute("open","")}}
    function complete(){if(!progress.completedAt){progress.completedAt=Date.now();save()}const gate=$("#gateDialog");if(gate.open)gate.close();if(!$("#completeDialog").open)setTimeout(()=>{if(!$("#completeDialog").open)showEnding()},80)}
    function resetAdventure(){localStorage.removeItem(STORAGE_KEY);progress=normalize({});save();selected=null;$("#gateDialog").close?.();$("#completeDialog").close?.();message("新的冒險開始了，三枚印章等你收集！");render()}
    $("#openGate").addEventListener("click",openGate);$("#closeGate").addEventListener("click",()=>$("#gateDialog").close());$("#gateDialog").addEventListener("click",e=>{if(e.target===$("#gateDialog"))$("#gateDialog").close()});$("#endingPrevious").addEventListener("click",()=>{endingIndex=Math.max(0,endingIndex-1);renderEnding()});$("#endingNext").addEventListener("click",()=>{endingIndex=Math.min(4,endingIndex+1);renderEnding()});$("#backToMap").addEventListener("click",()=>$("#completeDialog").close());$("#completeDialog").addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&endingIndex<4){endingIndex++;renderEnding()}if(e.key==="ArrowLeft"&&endingIndex>0){endingIndex--;renderEnding()}});
    $("#sealTray").addEventListener("click",e=>{if(Date.now()<suppressClickUntil)return;const el=e.target.closest(".seal");if(!el||el.disabled||el.classList.contains("placed"))return;selected=selected===el.dataset.seal?null:el.dataset.seal;message(selected?`已拿起${NAMES[selected]}，再點正確凹槽。`:"已放回印章。")});
    $("#slots").addEventListener("click",e=>{const slot=e.target.closest(".slot");if(slot&&selected)place(selected,slot.dataset.slot)});$("#slots").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&selected){e.preventDefault();place(selected,e.target.closest(".slot")?.dataset.slot)}});
    $("#sealTray").addEventListener("pointerdown",e=>{const el=e.target.closest(".seal");if(!el||el.disabled||e.button>0)return;drag={id:e.pointerId,key:el.dataset.seal,startX:e.clientX,startY:e.clientY,ghost:null};try{el.setPointerCapture?.(e.pointerId)}catch(_){}});
    $("#sealTray").addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>7){drag.ghost=e.target.closest(".seal").querySelector(".seal-mark").cloneNode(true);drag.ghost.classList.add("drag-ghost");document.body.append(drag.ghost)}if(drag.ghost){e.preventDefault();drag.ghost.style.left=`${e.clientX}px`;drag.ghost.style.top=`${e.clientY}px`;$$('.slot').forEach(el=>el.classList.remove('over'));document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot')?.classList.add('over')}});
    function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const key=drag.key,wasDragging=!!drag.ghost,x=Number.isFinite(e.clientX)?e.clientX:drag.startX,y=Number.isFinite(e.clientY)?e.clientY:drag.startY;drag.ghost?.remove();$$('.slot').forEach(el=>el.classList.remove('over'));const slot=document.elementFromPoint(x,y)?.closest('.slot');drag=null;if(wasDragging){suppressClickUntil=Date.now()+300;if(slot)place(key,slot.dataset.slot);else message("印章沒有放進凹槽，已退回原位。")}}
    $("#sealTray").addEventListener("pointerup",endDrag);$("#sealTray").addEventListener("pointercancel",endDrag);$("#clearProgress").addEventListener("click",()=>{if(confirm("確定清除這次冒險的印章、計時與通關紀錄嗎？三款遊戲本身不會被刪除。"))resetAdventure()});$("#playAgain").addEventListener("click",resetAdventure);window.addEventListener("pageshow",()=>{progress=normalize(safeRead());render()});render();
  </script>
</body>
</html>
